schema_version: 3

runner:
  kind: omp
  # adapter path is relative to this runner directory.
  adapter_check: adapter.py

root:
  # Herdr's `--kind omp` supplies the executable; argv contains only native flags.
  # A named profile is an explicit run override; the default launch uses OMP's active profile.
  launch_argv:
    - --model
    - "@smart-cascade-root"
    - --thinking
    - high
  model_role: smart-cascade-root
  effort: high

# What the installed profile must provide for each Smart Cascade role.
# `definition` is relative to this runner directory; the rest is what the
# adapter expects that profile's own agent definition to project.
roles:
  leader:
    definition: roles/smart-cascade-leader.md
    agent: smart-cascade-leader
    model_role: smart-cascade-leader
    thinking_level: medium
  advisor:
    definition: roles/smart-cascade-advisor.md
    agent: smart-cascade-advisor
    model_role: smart-cascade-advisor
    thinking_level: max
  semantic_executor:
    definition: roles/smart-cascade-executor.md
    agent: smart-cascade-executor
    model_role: smart-cascade-semantic
    thinking_level: xhigh
  escalated_semantic_executor:
    definition: roles/smart-cascade-escalated-executor.md
    agent: smart-cascade-escalated-executor
    model_role: smart-cascade-escalated-semantic
    thinking_level: xhigh
  mechanical_executor:
    definition: roles/smart-cascade-mechanical-executor.md
    agent: smart-cascade-mechanical-executor
    model_role: smart-cascade-mechanical
    thinking_level: low
